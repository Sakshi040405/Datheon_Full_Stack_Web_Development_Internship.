
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Productivity Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
        <h1>Task<span>Flow.</span></h1>
        <p class="subtitle">Small steps. Big progress.</p>
      </div>
      <div class="date" id="todayDate"></div>
    </header>

    <section class="stats">
      <article class="stat-card">
        <span>Total tasks</span>
        <strong id="totalCount">0</strong>
      </article>
      <article class="stat-card">
        <span>In progress</span>
        <strong id="activeCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Completed</span>
        <strong id="completedCount">0</strong>
      </article>
    </section>

    <section class="panel">
      <h2>Create a task</h2>
      <form id="taskForm">
        <label for="taskInput">Task name</label>
        <input id="taskInput" type="text"
          placeholder="What do you want to accomplish?" required maxlength="150">

        <div class="form-grid">
          <div>
            <label for="categoryInput">Category</label>
            <select id="categoryInput">
              <option>Work</option>
              <option>Personal</option>
              <option>Study</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="dueDateInput">Due date</label>
            <input id="dueDateInput" type="date">
          </div>
        </div>
        <button class="primary-btn" type="submit">+ Add task</button>
      </form>
    </section>

    <section class="task-section">
      <div class="section-heading">
        <div>
          <h2>Your tasks</h2>
          <p>Stay focused on what matters.</p>
        </div>
        <input id="searchInput" class="search"
          type="search" placeholder="Search tasks..." aria-label="Search tasks">
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter active" data-filter="All">All</button>
        <button class="filter" data-filter="Active">Active</button>
        <button class="filter" data-filter="Completed">Completed</button>
      </nav>

      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty-state">
        <span>✦</span>
        <h3>No tasks found</h3>
        <p>Add a task or try another filter.</p>
      </div>
    </section>

    <footer>Built with HTML, CSS, JavaScript & localStorage.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
